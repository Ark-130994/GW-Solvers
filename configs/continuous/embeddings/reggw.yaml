
experiment_type: embedding
solver_type: continuous
device: cuda

dataset:
  dataset_name: twitter
  data_path: ../datasets
  emb_type_source: glove
  emb_type_target: glove
  source_dim: 100
  target_dim: 50
  n_max_samples: 400048
  n_train_samples: 388000
  n_test_samples: 2048
  n_eval: 1
  batch_size_train: 256
  batch_size_test: 256
  alpha: 1.0
  paired: true
  shuffle: false
  seed: 1
  test_seed: 0

solver:
  solver_name: RegGW
  n_epochs: 10000
  report_every: 1000
  hidden_sizes_mlp: [512, 256, 256]
  mover_lr: 0.0001
  cost_discrete: cosine
  eps_fit: 0.01
  eps_reg: 0.001
  lamb: 1.0
  seed: 0

metrics:
  top_n: [1, 5, 10]
  mmd_sigma: 10.0
  sinkhorn_blur: 0.01
  distortion_cost: cosine
