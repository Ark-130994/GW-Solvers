
experiment_type: toy
solver_type: continuous
device: cuda

dataset:
  toy_type: toy_3d_2d
  n_clusters_source: 10
  n_clusters_target: 10
  n_train_samples: 5000
  n_test_samples: 2048
  seed: 42

solver:
  solver_name: CycleGW
  n_epochs: 10000
  report_every: 500
  hidden_sizes_mlp: [512, 512, 512]
  f_lr: 0.001
  g_lr: 0.001
  eps: 0.005
  sigmas: [1.0]
  reg: 1
  kernel_type: sinkhorn
  take_median: true

metrics:
  top_n: [1, 5, 10]
  mmd_sigma: 10.0
  sinkhorn_blur: 0.01
  distortion_cost: cosine
