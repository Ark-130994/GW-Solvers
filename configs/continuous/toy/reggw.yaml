
experiment_type: toy
solver_type: continuous
device: cuda

dataset:
  toy_type: toy_3d_2d
  n_clusters_source: 10
  n_clusters_target: 10
  n_train_samples: 5000
  n_test_samples: 2048
  seed: 42

solver:
  solver_name: RegGW
  n_epochs: 200
  report_every: 20
  hidden_sizes_mlp: [512, 256, 256]
  mover_lr: 0.0001
  cost_discrete: cosine
  eps_fit: 0.01
  eps_reg: 0.001
  lamb: 1.0
  seed: 0

metrics:
  top_n: [1, 5, 10]
  mmd_sigma: 10.0
  sinkhorn_blur: 0.01
  distortion_cost: cosine
