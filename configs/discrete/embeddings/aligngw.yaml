
experiment_type: embedding
solver_type: discrete
device: cuda

dataset:
  dataset_name: twitter
  data_path: ../datasets
  emb_type_source: glove
  emb_type_target: glove
  source_dim: 100
  target_dim: 50

  n_max_samples: 400000
  n_train_samples: 6000
  n_test_samples: 2048
  n_eval: 1
  alpha: 0.4

  seed: 42
  test_seed: 0
  shuffle: true

solver:
  solver_name: AlignGW
  n_epochs: 200
  report_every: 20
  cost_name: cosine
  normalize_dists: mean
  loss_fun: square_loss
  eps: 1.0e-3
  ot_warm: true

metrics:
  top_n: [1, 5, 10]
  mmd_sigma: 10.0
  sinkhorn_blur: 0.01
  distortion_cost: cosine
