
experiment_type: toy
solver_type: discrete
device: cpu


dataset:
  toy_type: toy_3d_2d
  n_clusters_source: 10
  n_clusters_target: 10
  n_train_samples: 10000
  n_test_samples: 2048
  seed: 42

solver:
  solver_name: AlignGW
  n_epochs: 200
  report_every: 20

  cost_name: euclidean
  normalize_dists: max
  loss_fun: square_loss
  eps: 0.01
  ot_warm: true
