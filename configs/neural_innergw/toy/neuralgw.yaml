
experiment_type: toy
solver_type: continuous
device: cuda

dataset:
  toy_type: toy_3d_2d
  n_clusters_source: 10
  n_clusters_target: 10
  n_train_samples: 5000
  n_test_samples: 2048
  batch_size_train: 256
  seed: 42

solver:
  solver_name: NeuralGW
  n_epochs: 2000
  report_every: 10

  hidden_sizes_mover_mlp: [128, 128, 128, 128]
  hidden_sizes_critic_mlp: [128, 128, 128, 128]

  mover_lr: 0.001
  critic_lr: 0.001
  cost_lr: 0.001

  cost_iters: 10
  critic_iters: 5
  mover_iters: 10

  reg_critic: 0.1

metrics:
  top_n: [1, 5, 10]
  mmd_sigma: 10.0
  sinkhorn_blur: 0.01
  distortion_cost: cosine
